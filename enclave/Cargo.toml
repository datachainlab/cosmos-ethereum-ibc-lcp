[package]
name = "enclave"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
name = "proxy_enclave"
crate-type = ["staticlib"]

[dependencies]
enclave-runtime = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.18" }
tendermint-lc = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.18", default-features = false }
ethereum-elc = { git = "https://github.com/datachainlab/ethereum-elc", rev = "v0.2.2", default-features = false }

[build-dependencies]
sgx-build = { tag = "v0.1.0", git = "https://github.com/datachainlab/sgx-sdk-rs" }

[patch."https://github.com/bluele/ssz_rs"]
ssz-rs = { git = "https://github.com/yoshidan/ssz_rs", branch = "remove-unused-thiserror" }
ssz-rs-derive = { git = "https://github.com/yoshidan/ssz_rs", branch = "remove-unused-thiserror" }

[patch."crates-io"]
ibc = { git = "https://github.com/datachainlab/ibc-rs", rev = "v0.29.0-channel-upgrade-path" }

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
