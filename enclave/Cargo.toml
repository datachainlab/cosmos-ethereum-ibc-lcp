[package]
name = "enclave"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
name = "proxy_enclave"
crate-type = ["staticlib"]

[dependencies]
enclave-runtime = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17" }
tendermint-lc = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17", default-features = false }
ethereum-elc = { git = "https://github.com/datachainlab/ethereum-elc", rev = "v0.1.0", default-features = false }
polygon-elc = { git = "https://github.com/datachainlab/polygon-elc", rev = "b107e333494c47dcf118e8f10e3aedef0a0749c2", default-features = false }
# Pin getrandom so the [patch] below (only versioned for 0.2.8) actually applies;
# without this, transitive deps may pull a newer getrandom that the SGX-lite patch
# doesn't match, and linking fails on libc syscalls.
getrandom = { version = "=0.2.8" }

[patch."crates-io"]
getrandom = { git = "https://github.com/datachainlab/getrandom-sgx-lite" }
# TODO these patches would be better as optional
sha2-0108 = { git = "https://github.com/bluele/hashes", branch = "0.10.8-sha256-hwa-disabled", package = "sha2" }
sha2-099 = { git = "https://github.com/bluele/hashes", branch = "0.9.9-sha256-hwa-disabled", package = "sha2" }
ibc = { git = "https://github.com/datachainlab/ibc-rs", rev = "v0.29.0-channel-upgrade-path" }

# ethereum-elc v0.1.0 was released against lcp v0.2.14; bumping our enclave to
# v0.2.17 leaves two copies of every lcp leaf crate in the graph and the `dyn
# LightClientRegistry` cast then fails because the traits come from different
# crate versions. Force the entire lcp surface that ethereum-elc / polygon-elc
# transitively depend on to resolve through the local lcp/ submodule (already
# pinned at v0.2.17).
[patch."https://github.com/datachainlab/lcp"]
light-client = { path = "../lcp/modules/light-client" }
store = { path = "../lcp/modules/store" }
context = { path = "../lcp/modules/context" }
lcp-types = { path = "../lcp/modules/types" }
commitments = { path = "../lcp/modules/commitments" }
crypto = { path = "../lcp/modules/crypto" }
ocall-commands = { path = "../lcp/modules/ocall-commands" }

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
